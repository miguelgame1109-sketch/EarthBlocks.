worker_processes 1;

events {
    worker_connections 1024;
}

http {
    types {
        text/html html;
        text/css css;
    }

    default_type application/octet-stream;

    server {
        listen 8080;
        server_name localhost;

        root html;
        index index.html;

        location = /api/profile {
            default_type application/json;
            content_by_lua_file html/profile.lua;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}